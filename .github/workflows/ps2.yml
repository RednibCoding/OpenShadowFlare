name: Build PlayStation 2 ISO

on:
  push:
    paths:
      - '.github/workflows/ps2.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'thirdparty/**'
      - 'tools/ps2/**'
  pull_request:
    paths:
      - '.github/workflows/ps2.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'thirdparty/**'
      - 'tools/ps2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PS2DEV: ${{ runner.temp }}/ps2dev

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install PS2DEV
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake genisoimage
          mkdir -p "$PS2DEV"
          curl --fail --location --retry 3 \
            --output /tmp/ps2dev.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          tar --extract --file /tmp/ps2dev.tar.gz --strip-components=1 --directory "$PS2DEV"

      - name: Build the data-free ISO
        run: sh tools/ps2/build-iso.sh

      - name: Verify the ISO
        run: |
          test -s build/ps2/openshadowflare.iso
          ! isoinfo -i build/ps2/openshadowflare.iso -f | grep -qi 'SFGAME.BIN'

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: openshadowflare-ps2-release
          path: build/ps2/openshadowflare.iso
          if-no-files-found: error
